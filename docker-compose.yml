version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: earnmart-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: earnmart
      MYSQL_USER: earnmart_user
      MYSQL_PASSWORD: earnmart_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-prootpassword']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: earnmart-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://earnmart_user:earnmart_password@mysql:3306/earnmart
      PORT: 4000
    ports:
      - '4000:4000'

volumes:
  mysql_data:

